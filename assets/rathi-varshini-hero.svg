<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Rathi Varshini R — Software Developer</title>
<desc id="desc">Software Developer focused on AI and machine learning, full-stack engineering and applied retrieval systems.</desc>
<defs>
  <linearGradient id="rv-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#10070C"/><stop offset=".56" stop-color="#190B12"/><stop offset="1" stop-color="#451126"/>
  </linearGradient>
  <linearGradient id="rv-glow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#701A3D"/><stop offset=".5" stop-color="#E5B5C7"/><stop offset="1" stop-color="#C77B9B"/>
    <animate attributeName="x1" values="0;1;0" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="1;0;1" dur="12s" repeatCount="indefinite"/>
  </linearGradient>
  <pattern id="rv-grid" width="34" height="34" patternUnits="userSpaceOnUse">
    <path d="M34 0H0V34" fill="none" stroke="#E5B5C7" stroke-opacity=".075" stroke-width="1"/>
  </pattern>
  <radialGradient id="rv-orb"><stop stop-color="#C77B9B" stop-opacity=".28"/><stop offset="1" stop-color="#C77B9B" stop-opacity="0"/></radialGradient>
  <filter id="rv-soft"><feGaussianBlur stdDeviation="9"/></filter>
</defs>
<rect width="1200" height="360" rx="22" fill="url(#rv-bg)"/>
<rect width="1200" height="360" rx="22" fill="url(#rv-grid)"/>
<circle cx="1010" cy="155" r="210" fill="url(#rv-orb)"/>
<circle cx="1010" cy="155" r="118" fill="none" stroke="#C77B9B" stroke-opacity=".25"/>
<circle cx="1010" cy="155" r="158" fill="none" stroke="#E5B5C7" stroke-opacity=".14" stroke-dasharray="3 9">
  <animateTransform attributeName="transform" type="rotate" from="0 1010 155" to="360 1010 155" dur="70s" repeatCount="indefinite"/>
</circle>
<path d="M820 220 C900 60 1020 300 1155 105" fill="none" stroke="url(#rv-glow)" stroke-width="2" opacity=".75">
  <animate attributeName="stroke-dasharray" values="0 600;260 600;0 600" dur="9s" repeatCount="indefinite"/>
</path>
<circle cx="1155" cy="105" r="4" fill="#E5B5C7"><animate attributeName="opacity" values=".35;1;.35" dur="3s" repeatCount="indefinite"/></circle>
<text x="82" y="82" fill="#E5B5C7" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="4">DEVELOPER PROFILE  /  COIMBATORE, INDIA</text>
<text x="78" y="177" fill="#F8F0F3" font-family="Georgia, 'Times New Roman', serif" font-size="64" letter-spacing="-1.5">Rathi Varshini R.</text>
<rect x="82" y="205" width="370" height="3" rx="2" fill="url(#rv-glow)">
  <animate attributeName="width" values="170;370;170" dur="7s" repeatCount="indefinite"/>
</rect>
<text x="82" y="252" fill="#E5B5C7" font-family="Arial, Helvetica, sans-serif" font-size="19" letter-spacing="1.1">SOFTWARE DEVELOPER  ·  AI / ML  ·  FULL-STACK</text>
<text x="82" y="292" fill="#F8F0F3" fill-opacity=".72" font-family="Arial, Helvetica, sans-serif" font-size="15">Building useful applications and exploring how intelligent systems retrieve,</text>
<text x="82" y="315" fill="#F8F0F3" fill-opacity=".72" font-family="Arial, Helvetica, sans-serif" font-size="15">organise and evaluate information.</text>
<path d="M82 338H1118" stroke="#C77B9B" stroke-opacity=".28"/>
</svg>