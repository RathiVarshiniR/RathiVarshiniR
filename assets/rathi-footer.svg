<path d="M0 35H1200" stroke="url(#ft-line)" stroke-width="1.5"/>
<path d="M0 35 C220 35 220 82 420 82 S690 0 870 35 S1080 35 1200 35" fill="none" stroke="#C77B9B" stroke-opacity=".55" stroke-width="1.4" stroke-dasharray="5 8">
